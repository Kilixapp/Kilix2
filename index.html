<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kilix - منصة التجارة بالجملة في الجزائر</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Arabic Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BACKGROUND DECORATION
    ========================== -->
    <div class="page-decoration" aria-hidden="true">
        <div class="orange-shape orange-shape-top"></div>
        <div class="orange-line orange-line-1"></div>
        <div class="orange-line orange-line-2"></div>
        <div class="orange-shape orange-shape-side"></div>
    </div>


    <!-- =========================
         HEADER
    ========================== -->
    <header class="navbar">

        <div class="container nav-container">

            <!-- Menu -->
            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="فتح القائمة"
                aria-expanded="false"
                type="button"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>


            <!-- Logo -->
            <a href="#" class="logo" aria-label="Kilix">
                <span class="logo-orange">Ki</span><span class="logo-blue">lix</span>
            </a>


            <!-- Download -->
            <a href="#download" class="btn-download-nav">
                <span>حمّل التطبيق</span>
                <i class="fa-solid fa-download"></i>
            </a>

        </div>

    </header>


    <!-- =========================
         HERO
    ========================== -->
    <main>

        <section class="hero">

            <div class="container hero-container">

                <!-- HERO CONTENT -->
                <div class="hero-content">

                    <!-- Location Badge -->
                    <div class="badge">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>منصة التجارة بالجملة في الجزائر</span>
                    </div>


                    <!-- Main Heading -->
                    <h1 class="hero-title">
                        <span class="title-line title-line-dark">
                            كل ما تحتاجه
                        </span>

                        <span class="title-line title-line-dark">
                            للجملة،
                        </span>

                        <span class="title-line highlight">
                            في مكان واحد.
                        </span>
                    </h1>


                    <!-- Decorative underline -->
                    <div class="title-underline" aria-hidden="true"></div>


                    <!-- Description -->
                    <p class="hero-description">
                        اكتشف المنتجات، قارن أسعار الجملة،
                        تعرّف على الموردين واطلب مباشرة
                        من هاتفك.
                    </p>


                    <!-- DOWNLOAD BUTTONS -->
                    <div class="cta-buttons" id="download">

                        <!-- Android -->
                        <a href="#" class="btn btn-primary">
                            <i class="fa-brands fa-android"></i>

                            <span>حمّل Kilix الآن</span>

                            <i class="fa-solid fa-arrow-left btn-arrow"></i>
                        </a>


                        <!-- App Store -->
                        <a href="#" class="btn btn-secondary">
                            <i class="fa-brands fa-apple"></i>

                            <span>App Store</span>
                        </a>

                    </div>


                    <!-- Availability -->
                    <div class="platform-availability">

                        <span>
                            متوفر على أندرويد
                        </span>

                        <span class="divider">|</span>

                        <span class="muted">
                            قريباً على iOS
                        </span>

                    </div>

                </div>


                <!-- PHONE -->
                <div class="hero-image">

                    <div class="phone-wrapper">

                        <img
                            src="Screenshot_2026-09-10-01-45-00-46_0ad4b9978e45354647ad0aaf72022460.jpg"
                            alt="واجهة تطبيق Kilix للتجارة بالجملة"
                            class="phone-img"
                        >

                    </div>

                </div>
